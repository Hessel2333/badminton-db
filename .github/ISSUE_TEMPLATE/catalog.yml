name: Add or correct equipment
description: Submit a product, specification correction, alias, or media permission.
body:
  - type: input
    id: product
    attributes:
      label: Brand and model / 品牌与型号
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed addition or correction / 补充或更正内容
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources / 资料来源
      description: Link manufacturer pages where possible. Identify which fields each source supports.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Image rights, if applicable / 图片授权
      description: State the photographer/rights holder, license and permission evidence. Do not attach images without permission to redistribute them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public data only / 仅提交公开资料
      options:
        - label: This submission contains no personal purchase records, serial numbers, private notes or account information.
          required: true
